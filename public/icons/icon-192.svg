<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="50%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Outer Tech Ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#neonGrad)" stroke-width="4" stroke-opacity="0.3" stroke-dasharray="24 16" />
  <circle cx="256" cy="256" r="185" fill="none" stroke="#4F46E5" stroke-width="1.5" stroke-opacity="0.2" />

  <!-- Central Shield Glow -->
  <path d="M 256 95 L 390 155 V 275 C 390 355 256 425 256 425 C 256 425 122 355 122 275 V 155 Z" fill="#1E1B4B" fill-opacity="0.7" stroke="url(#neonGrad)" stroke-width="6" filter="url(#glow)" />

  <!-- Code Chevron Left -->
  <path d="M 205 210 L 160 256 L 205 302" fill="none" stroke="#38BDF8" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Code Chevron Right -->
  <path d="M 307 210 L 352 256 L 307 302" fill="none" stroke="#38BDF8" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Stylized Monogram S -->
  <path d="M 292 195 C 285 180 265 170 244 175 C 220 180 210 200 215 220 C 220 240 245 250 268 260 C 295 272 308 288 300 315 C 292 340 265 352 235 348 C 210 344 195 330 190 315" fill="none" stroke="url(#neonGrad)" stroke-width="18" stroke-linecap="round" />

  <!-- Star of Excellence / North Star -->
  <polygon points="256,125 263,143 282,143 267,154 272,172 256,160 240,172 245,154 230,143 249,143" fill="url(#accentGrad)" />

  <!-- Accent Nodes -->
  <circle cx="256" cy="425" r="7" fill="#F59E0B" />
  <circle cx="122" cy="155" r="6" fill="#38BDF8" />
  <circle cx="390" cy="155" r="6" fill="#8B5CF6" />
</svg>
